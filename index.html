<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khedut Mitra - Camera</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body style="text-align: center; font-family: sans-serif; padding: 20px;">

    <h2>ખેડૂત મિત્ર</h2>
    
    <button type="button" onclick="startCamera()" style="padding: 12px 24px; font-size: 16px; cursor: pointer;">
        કૅમેરા ચાલુ કરો
    </button>

    <div id="webcam-container" style="margin-top: 20px;"></div>
    <div id="label-container" style="margin-top: 15px;"></div>
    <div id="error-log" style="color: red; margin-top: 15px; font-weight: bold;"></div>

    <script>
        const URL = "./my_model/";
        let model, webcam, labelContainer, maxPredictions;

        async function startCamera() {
            const errorDiv = document.getElementById("error-log");
            const webcamContainer = document.getElementById("webcam-container");
            errorDiv.innerHTML = "";
            webcamContainer.innerHTML = ""; // જૂનો કેમેરા કેનવાસ સાફ કરવા માટે

            try {
                // ૧. મોડેલ લોડ કરો
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // ૨. Teachable Machine કેમેરા સેટઅપ
                const width = 250;
                const height = 250;
                const flip = false; // બેક કેમેરા માટે false રાખવું
                
                webcam = new tmImage.Webcam(width, height, flip);
                await webcam.setup({ facingMode: "environment" }); // કેમેરા માટે વિનંતી
                await webcam.play(); // વીડિયો સ્ટ્રીમ ચાલુ કરો
                
                window.requestAnimationFrame(loop);

                // ૩. કેમેરાનો કેનવાસ DOM માં ઉમેરો
                webcam.canvas.style.border = "2px solid #333";
                webcam.canvas.style.borderRadius = "8px";
                webcamContainer.appendChild(webcam.canvas);

                // ૪. લેબલ કન્ટેનર રેડી કરો
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
            } catch (err) {
                console.error(err);
                errorDiv.innerHTML = "Error: " + err.message;
            }
        }

        async function loop() {
            webcam.update(); // કૅમેરાની દરેક ફ્રેમ અપડેટ કરો
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(0) + "%";
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>
</body>
</html>
