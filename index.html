<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khedut Mitra - Camera Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body style="text-align: center; font-family: sans-serif; padding: 20px;">

    <h2>ખેડૂત મિત્ર - કૅમેરા ચેક</h2>
    
    <button type="button" onclick="startCamera()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">
        કૅમેરા ચાલુ કરો
    </button>

    <div id="webcam-container" style="margin-top: 20px;"></div>
    <div id="error-log" style="color: red; margin-top: 15px; font-weight: bold;"></div>

    <script>
        const URL = "./my_model/";
        let model, webcam;

        async function startCamera() {
            const errorDiv = document.getElementById("error-log");
            errorDiv.innerHTML = ""; // Clear previous errors

            // ૧. સિક્યોરિટી ચેક (HTTPS છે કે નહીં)
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                errorDiv.innerHTML = "ભૂલ: કૅમેરા ફક્ત HTTPS લિંક અથવા Localhost પર જ કામ કરશે!";
                return;
            }

            try {
                // ૨. ફોન/લેપટોપ કેમેરાની પર્સનલ પરવાનગી માંગો
                await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });

                // ૩. Teachable Machine કેમેરા લોડ કરો
                webcam = new tmImage.Webcam(250, 250, false); // facingMode માટે false સેટ કર્યું છે
                await webcam.setup({ facingMode: "environment" }); // પાછળનો કેમેરા ઓપન કરવા માટે
                await webcam.play();
                
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                errorDiv.style.color = "green";
                errorDiv.innerHTML = "કૅમેરા સફળતાપૂર્વક ચાલુ થઈ ગયો છે!";
            } catch (err) {
                console.error(err);
                errorDiv.style.color = "red";
                errorDiv.innerHTML = "Error: " + err.message + "<br>કૃપા કરીને બ્રાઉઝર સેટિંગ્સમાં કેમેરા Allow કરો.";
            }
        }
    </script>
</body>
</html>
